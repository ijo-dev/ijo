name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens and the registry generate files the site imports, so they go first.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      # The generated files must match what is committed, or the code tabs and
      # the shadcn registry have drifted from the component source.
      - name: Check generated files are up to date
        run: git diff --exit-code -- packages/registry/registry.json packages/registry/src/generated

      - name: Install Playwright browsers
        run: pnpm --filter @ijo/web exec playwright install --with-deps chromium

      - run: pnpm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      # Screenshots of key screens, so design changes can be checked without a local build.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: apps/web/screenshots
          if-no-files-found: ignore
          retention-days: 7

      # Also keep them on a throwaway branch, readable through the GitHub API by
      # tools that cannot download artifacts. Only for branches in this repo.
      - name: Publish screenshots to a branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/web/screenshots/**') != '' }}
        env:
          BRANCH: screenshots/${{ github.head_ref }}
        run: |
          cp -r apps/web/screenshots "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b "$BRANCH"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
