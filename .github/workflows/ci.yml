name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens and the registry generate files the site imports, so they go first.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      # The generated files must match what is committed, or the code tabs and
      # the shadcn registry have drifted from the component source.
      - name: Check generated files are up to date
        run: git diff --exit-code -- packages/registry/registry.json packages/registry/src/generated

      - name: Install Playwright browsers
        run: pnpm --filter @ijo/web exec playwright install --with-deps chromium

      - run: pnpm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
